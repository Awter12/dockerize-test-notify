apiVersion: apps/v1
kind: Deployment
metadata:
  name: dockerize-test-notify
  labels:
    app: dockerize-test-notify
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dockerize-test-notify
  template:
    metadata:
      labels:
        app: dockerize-test-notify
    spec:
      containers:
        - name: dockerize-test-notify
          image: bret77/dockerize-test-notify:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: dockerize-test-notify-config
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: dockerize-test-notify-secret
                  key: API_KEY
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /will
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10